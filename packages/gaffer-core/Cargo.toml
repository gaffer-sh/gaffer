[package]
name = "gaffer-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Core library for Gaffer test analytics"
license = "MIT"
repository = "https://github.com/gaffer-sh/gaffer"
homepage = "https://gaffer.sh"

[lib]
crate-type = [ "rlib" ]

[dependencies]
rusqlite = { version = "0.32", features = [ "bundled" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
uuid = { version = "1", features = [ "v4" ] }
chrono = { version = "0.4", features = [ "serde" ] }
regex = "1"
ureq = { version = "3", features = [ "json" ] }
thiserror = "2"
gaffer-parsers = { path = "../gaffer-parsers" }
# Async HTTP — used only by the `upload` module so the binary can do bounded
# parallel multipart-PUTs (see TASK-40). The rest of gaffer-core stays sync.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "fs"
] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "multipart",
  "stream"
] }
futures = "0.3"
bytes = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "fs"
] }

[lints]
workspace = true
