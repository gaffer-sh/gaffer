[package]
name = "gaffer-parsers"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test report and coverage parsers for Gaffer"
license = "MIT"
repository = "https://github.com/gaffer-sh/gaffer"
homepage = "https://gaffer.sh"

[lib]
crate-type = [
  "cdylib",
  "rlib"
]

[features]
# Diagnostic logging for parser edge cases — currently the TRX parser's
# unrecognised-outcome branch (src/trx.rs). Off by default: the WASM build ships
# to the dashboard where stderr goes nowhere useful. Declared here because
# `#[cfg(feature = "logging")]` on an undeclared feature is silently always-false,
# which is exactly the bug `unexpected_cfgs` exists to catch.
logging = []

[dependencies]
quick-xml = "0.37"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints]
workspace = true
